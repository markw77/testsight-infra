name: Renovate

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # After a PR closes its merge ref may be gone, so fall back to the base
          # branch for pull_request events; other events use the selected ref.
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Cache Renovate
        uses: actions/cache@v4
        with:
          path: ~/.cache/renovate
          key: renovate-${{ runner.os }}-${{ hashFiles('renovate.json') }}
          restore-keys: |
            renovate-${{ runner.os }}-

      # Do not pass `configurationFile`: Renovate reads renovate.json from the
      # target branch itself. Mounting the same file as RENOVATE_CONFIG_FILE makes
      # Renovate concatenate both copies and extract every pin twice.
      - name: Run Renovate
        uses: renovatebot/github-action@v48.0.0
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
          RENOVATE_PLATFORM_COMMIT: "enabled"
