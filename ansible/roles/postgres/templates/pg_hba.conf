# PostgreSQL host-based authentication for the dedicated PC.
#
# Only local sockets, the host itself, the k3s pod network, and the dedicated
# pgAdmin Docker network may connect. LAN clients hitting the published port
# are rejected because their source address is not listed.
# Use `docker compose exec postgres psql -U {{ postgres_db }} -d {{ postgres_db }}`
# for host administration, or pgAdmin through the Docker network.

# TYPE  DATABASE  USER  ADDRESS           METHOD
local   all       all                     scram-sha-256
host    all       all   127.0.0.1/32      scram-sha-256
host    all       all   ::1/128           scram-sha-256

# k3s pod network (control plane -> host Postgres).
host    all       all   {{ k3s_pod_cidr }}      scram-sha-256

# Traffic that k3s SNATs to the node address.
host    all       all   {{ testsight_host_ip }}/32  scram-sha-256

# pgAdmin on the dedicated Docker network.
host    all       all   {{ pgadmin_network_cidr }}     scram-sha-256

# Everything else, including LAN clients, is rejected.
host    all       all   all               reject
