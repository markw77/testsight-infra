---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ testsight_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - rsync
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Configure journald size limit
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-testsight.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
      SystemKeepFree=1G
      MaxRetentionSec=1month
  notify: Restart journald

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Disable automatic reboot after upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-testsight-no-reboot
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
