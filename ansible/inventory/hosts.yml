---
# Inventory for the single dedicated host.
#
# The address is not defined here on purpose: `ansible_host` resolves from
# testsight_host_ip, which lives in the gitignored host_vars file that
# scripts/deploy.sh writes from its --ip argument. Defining the address here
# would take precedence over host_vars and defeat that.
all:
  children:
    testsight_hosts:
      vars:
        # Read directly instead of via hostvars: a connection keyword is resolved
        # before host_vars are merged, so `ansible_host` cannot reference them.
        testsight_host_vars: >-
          {{ lookup('ansible.builtin.file',
                    inventory_dir ~ '/../host_vars/testsight/vars.yml') | from_yaml }}
      hosts:
        testsight:
          ansible_host: "{{ testsight_host_vars.testsight_host_ip }}"
          ansible_user: marek
